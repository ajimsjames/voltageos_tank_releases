name: "🐛 Bug Report (Motorola Edge 50 / tank)"
description: "File a bug report or regression for VoltageOS 6.1"
title: "[BUG]: "
labels: ["bug", "tank"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **VoltageOS 6.1** for **Motorola Edge 50 (`tank`)**!
        Please fill out this form with as much detail as possible.
  - type: input
    id: build_version
    attributes:
      label: "Build Version / Date"
      description: "e.g. voltage-6.1-tank-20260916-1610-UNOFFICIAL.zip or tag v6.1-tank-20260917"
      placeholder: "v6.1-tank-20260917"
    validations:
      required: true
  - type: dropdown
    id: flash_type
    attributes:
      label: "Installation Type"
      description: "Did you clean flash or dirty flash?"
      options:
        - "Clean Flash (Data Formatted via Recovery)"
        - "Dirty Flash (Updated over prior VoltageOS build)"
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: "Root / Custom Modules"
      description: "Are you running pure stock kernel non-root, or Magisk / KernelSU?"
      placeholder: "None (Pure Stock Non-Root)"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step by step instructions on how to reproduce the bug."
      placeholder: |
        1. Go to Settings > Display
        2. Toggle Refresh Rate
        3. Observe flicker or crash
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logcat / dmesg / Stacktrace"
      description: "Paste relevant logcat or dmesg output."
      render: shell
    validations:
      required: false
